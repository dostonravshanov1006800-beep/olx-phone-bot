# OLX Phone Hunter — модели 2021 года и новее.
# Регулярки применяются к заголовку объявления (lowercase).
# Новые поколения подхватываются автоматически за счёт диапазонов.

brands:
  apple:
    - '(?:iphone|айфон)\s*(1[2-9]|2\d)\s*(?:pro\s*max|pro\s*air|pro|plus|mini|max|air|e)?'
    - '(?:iphone|айфон)\s*se\s*(?:3|2022)'
  samsung:
    - 'galaxy\s*s\s?(2[1-9]|3\d)\s*(?:ultra|plus|\+|fe|edge)?'
    - 'galaxy\s*z\s*(?:flip|флип)\s*[3-9]'
    - 'galaxy\s*z\s*(?:fold|фолд)\s*[3-9]'
    - 'galaxy\s*a\s?(5[2-9]|3[3-9]|2[3-9]|1[3-9])\b'
    - '(?:самсунг|samsung)\s*s\s?2[1-9]\b'
    - '(?:самсунг|samsung)\s*z\s*(?:flip|fold)\s*[3-9]'
    - '(?:самсунг|samsung)\s*a\s?(5[2-9]|3[3-9]|2[3-9]|1[3-9])\b'
  xiaomi:
    - 'xiaomi\s*(?:1[1-9]|2\d)\b'
    - 'redmi\s*note\s*(?:1[0-9]|2\d)\b'
    - 'poco\s*(?:f\s?[3-9]|x\s?[3-9]|g?t|f[4-9]|x[4-9])\b'
    - '(?:сяоми|редми)\s*note\s*(?:1[0-9]|2\d)\b'
  google:
    - 'pixel\s*(?:[6-9]|1\d)\b'
    - 'пиксель\s*(?:[6-9]|1\d)\b'
  oneplus:
    - 'oneplus\s*(?:9\b|1\d|nord)'
    - 'ванплас\s*(?:9\b|1\d|nord)'
  honor:
    - 'honor\s*(?:magic\s*[3-9]|x\s*[7-9]\w*|5[0-9]\b|7[0-9]\b|8[0-9]\b|9[0-9]\b|1\d\d|2\d\d|4\d\d|40\b)'
    - 'хонор\s*(?:magic\s*[3-9]|x\s*[7-9]\w*|5[0-9]\b|7[0-9]\b|8[0-9]\b|9[0-9]\b|1\d\d|2\d\d|4\d\d)'
  realme:
    - 'realme\s*(?:gt|[89]\b|1[0-9]|2\d)'
    - 'риалми\s*(?:gt|[89]\b|1[0-9]|2\d)'
  oppo:
    - 'oppo\s*(?:find\s*x\s*[3-9]|reno\s*[6-9])'
    - 'оппо\s*(?:find\s*x\s*[3-9]|reno\s*[6-9])'
  vivo:
    - 'vivo\s*(?:x\s*[6-9]\d|v\s*2[1-9]|iqoo)'
  nothing:
    - 'nothing\s*phone'
  motorola:
    - 'moto(?:rola)?\s*(?:edge\s*(?:2\d|[3-9]\d)|g\s*[5-9]\d)'
  infinix:
    - 'infinix\s*(?:note\s*1[1-9]|zero\s*\d|gt)'
  tecno:
    - 'tecno\s*(?:camon\s*(?:1[89]|2\d)|phantom)'

